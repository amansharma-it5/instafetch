name: Feature request
description: Suggest a focused improvement without sharing private media or credentials.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please do not include passwords, cookies, private links, signed preview/download URLs, tokens, captions, or personal information.
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform or format
      placeholder: Instagram Reel, YouTube Short, mobile browser
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: why_it_matters
    attributes:
      label: Why does this matter?
    validations:
      required: true
