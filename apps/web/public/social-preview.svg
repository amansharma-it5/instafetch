  <text x="366" y="245" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700">InstaFetch</text>
  <text x="366" y="318" fill="#e9e8ff" font-family="Arial, Helvetica, sans-serif" font-size="30">Public Instagram Reel downloads</text>
  <text x="144" y="443" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25" opacity=".9">Preview first. Download when a genuine public file is available.</text>
